name: tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run dependency-free release smoke check
        run: python scripts/release_smoke.py
      - name: Install test and packaging dependencies
        run: python -m pip install -r requirements-test.txt build setuptools wheel
      - name: Run mechanism tests
        run: PYTHONPATH=. pytest -q
      - name: Run offline examples and CLI entry points
        run: |
          PYTHONPATH=. python examples/offline_mechanisms.py
          python -m edgecraft --help
          python -m edgecraft synth --help
          python -m edgecraft profile show paper
          python -m edgecraft profile show paper-audit
      - name: Validate edge-runner shell entry points
        run: |
          for script in edgecraft/tools/deploy/runner/server/*.sh edgecraft/tools/deploy/runner/edge/bin/edgecraft-edge-runner edgecraft/tools/deploy/runner/edge/install.sh; do
            bash -n "$script"
          done
      - name: Build and test the installed wheel
        run: |
          python -m build --wheel --no-isolation
          python -m pip install --no-deps dist/*.whl
          python scripts/check_installed_package.py
