[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgecraft-research"
version = "0.1.0"
description = "EdgeCraft: MCaaS prototype for IoT/Edge AI"
authors = [
    { name = "Genglin Wang" },
    { name = "Kaiwei Liu" },
    { name = "Liekang Zeng" },
    { name = "Wangsong Yin" },
    { name = "Shangcheng Jin" },
    { name = "Guoliang Xing" },
    { name = "Zhenyu Yan" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0,<3",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "skl2onnx>=1.19,<2",
    "pillow>=10.0",
    "datasets>=3.0,<5",
    "soundfile>=0.12",
    "accelerate>=1.0,<2",
    "onnx>=1.14.0",
    "protobuf>=5.29,<7",
    "requests>=2.31.0",
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "openai>=1.0.0",
    "chromadb>=0.4.0",
    "ultralytics>=8.0.0",
    "timm>=0.9.0",
    "torch>=2.0.0,<2.10.0",
    "torchvision>=0.15,<0.25",
    "torchaudio>=2.0.0,<2.10.0",
    "transformers>=4.46,<5",
    "huggingface_hub>=0.20.0,<1.0.0",
    "speechbrain>=0.5.16,<1.1.0",
    "hyperpyyaml>=1.2.2",
    "sentencepiece>=0.1.99",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "kaggle>=1.5.0",
    "arxivloader>=0.1.0",
    "google-search-results>=2.4.0",
    "langchain-openai>=0.0.5",
    "onnxscript>=0.1.0",
    "paramiko>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "mypy",
]
test = [
    "pytest>=7.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "httpx>=0.28.0",
]
knowledge = [
    "loguru>=0.7.0",
    "kaggle>=1.5.0",
    "arxivloader>=0.1.0",
    "google-search-results>=2.4.0",
    "langchain-openai>=0.0.5",
]

[project.scripts]
edgecraft = "edgecraft.cli:main"

[project.urls]
Repository = "https://github.com/genglinWang/edgecraft"
Issues = "https://github.com/genglinWang/edgecraft/issues"
Paper = "https://arxiv.org/abs/2609.35167"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["edgecraft*"]

[tool.setuptools.package-data]
"edgecraft.config" = ["*.json", "*.yaml"]
"edgecraft.tools.deploy.benchmark" = ["run.sh"]
"edgecraft.tools.deploy" = ["runner/*.md", "runner/server/*.sh", "runner/edge/*.sh", "runner/edge/bin/*", "runner/edge/systemd/*"]
